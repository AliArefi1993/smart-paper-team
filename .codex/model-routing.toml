# Single source of truth for task category -> model selection.
# Codex does not load this file as native model configuration. The main agent reads
# it and passes the selected model and reasoning effort when spawning a subagent.
# Keep agent roles and other project guidance free of model IDs.

[category.routine]
model = "gpt-6-luna"
reasoning_effort = "medium"
use_for = "Documented commands, repository checks, first-pass triage, release preflight, and checklist drafting."

[category.scoped_implementation]
model = "gpt-6.1-sol"
reasoning_effort = "medium"
use_for = "Clear acceptance criteria, a bounded module, and known validation in one owning repository."

[category.complex_implementation]
model = "gpt-6.1-sol"
reasoning_effort = "high"
use_for = "Ambiguous logic, cross-stack contracts, migrations, or multi-step debugging."

[category.product_design]
model = "gpt-6.1-sol"
reasoning_effort = "high"
use_for = "Product framing, bilingual interaction design, accessibility, and design handoffs."

[category.critical_review]
model = "gpt-6-astra"
reasoning_effort = "high"
use_for = "Independent security, architecture, release-risk, or high-impact correctness review."
